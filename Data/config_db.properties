# =====================================================
# CONFIGURACI\u00d3N DE CONEXI\u00d3N A BASE DE DATOS - MINIPIGS
# =====================================================

# Configuraci\u00f3n principal de conexi\u00f3n
# CONFIGURACI\u00d3N B\u00c1SICA - USA ESTA
db.url=jdbc:mysql://localhost:3306/minipigs_db?useSSL=false&serverTimezone=America/Bogota
db.usuario=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# =====================================================
# CONFIGURACI\u00d3N DE POOL DE CONEXIONES (OPCIONAL)
# =====================================================
# Tama\u00f1o inicial del pool de conexiones
db.pool.inicial=5

# Tama\u00f1o m\u00e1ximo del pool de conexiones
db.pool.maximo=20

# Tiempo de espera m\u00e1ximo para obtener una conexi\u00f3n (en segundos)
db.pool.timeout=30

# =====================================================
# CONFIGURACI\u00d3N DE CONSULTAS (OPCIONAL)
# =====================================================
# Tiempo m\u00e1ximo de ejecuci\u00f3n de consultas (en segundos)
db.query.timeout=60

# =====================================================
# CONFIGURACI\u00d3N DE RECONEXI\u00d3N (OPCIONAL)
# =====================================================
# N\u00famero m\u00e1ximo de reintentos de conexi\u00f3n
db.reintentos.max=3

# Tiempo de espera entre reintentos (en milisegundos)
db.reintentos.retraso=2000

# =====================================================
# CONFIGURACI\u00d3N DE LOGS (OPCIONAL)
# =====================================================
# Nivel de logging (DEBUG, INFO, WARNING, ERROR)
db.log.nivel=INFO

# Mostrar consultas SQL en consola (true/false)
db.log.mostrar_consultas=false

# =====================================================
# NOTAS IMPORTANTES
# =====================================================
# 1. Cambiar 'localhost' por la IP del servidor si es remoto
# 2. Cambiar '3306' por el puerto configurado en MySQL
# 3. Cambiar 'root' por el usuario de base de datos
# 4. Cambiar 'password' por la contrase\u00f1a del usuario
# 5. Asegurar que la base de datos 'minipigs_db' exista
# 6. El driver debe estar en el classpath (mysql-connector-java)

